name: Release - Windows

on:
  release:
    types: [published]
  workflow_dispatch:  # возможность запустить вручную

permissions:
  contents: write    # для загрузки ассетов в релиз

defaults:
  run:
    shell: pwsh

jobs:
  build-windows:
    name: Windows (${{ matrix.libtorrent.version }}, ${{ matrix.config.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        libtorrent:
          - version: "2.1.0-rc1"
            boost_major_version: "1"
            boost_minor_version: "90"
            boost_patch_version: "0"
          - version: "2.0.11"
            boost_major_version: "1"
            boost_minor_version: "90"
            boost_patch_version: "0"
          - version: "1.2.20"
            boost_major_version: "1"
            boost_minor_version: "86"
            boost_patch_version: "0"
        config:
          - os: windows-latest
            arch: x64
            qt_arch: win64_msvc2022_64

    env:
      boost_path: "${{ github.workspace }}/../boost"
      libtorrent_path: "${{ github.workspace }}/../libtorrent"
      vcpkg_path: "c:/vcpkg"
      QT_ROOT_DIR: ""  # будет установлен действием install-qt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup devcmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.config.arch }}

      - name: Install build tools
        run: |
          if (-not (Get-Command "ninja.exe" -ErrorAction SilentlyContinue)) {
            choco install ninja --no-progress
          }
          ninja --version

      - name: Set variables for vcpkg (binary caching)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies with vcpkg
        run: |
          $triplet = "${{ matrix.config.arch }}-windows-static-md-release"
          $tripletDir  = "${{ env.vcpkg_path }}/triplets_overlay"
          New-Item -Force -ItemType Directory -Path $tripletDir
          Set-Content -Path "$tripletDir/$triplet.cmake" -Value @"
          set(VCPKG_TARGET_ARCHITECTURE ${{ matrix.config.arch }})
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_BUILD_TYPE release)
          "@
          
          $packages = @(
            "boost-build:$triplet",
            "openssl:$triplet",
            "zlib:$triplet"
          )
          & "${{ env.vcpkg_path }}/vcpkg.exe" upgrade --no-dry-run --overlay-triplets="$tripletDir"
          & "${{ env.vcpkg_path }}/vcpkg.exe" install `
            --binarysource="clear;x-gha,readwrite" `
            --clean-after-build `
            --overlay-triplets="$tripletDir" `
            $packages

      - name: Install Boost
        run: |
          $ver = "${{ matrix.libtorrent.boost_major_version }}.${{ matrix.libtorrent.boost_minor_version }}.${{ matrix.libtorrent.boost_patch_version }}"
          $folder = "boost_${{ matrix.libtorrent.boost_major_version }}_${{ matrix.libtorrent.boost_minor_version }}_${{ matrix.libtorrent.boost_patch_version }}"
          $url = "https://archives.boost.io/release/$ver/source/$folder.tar.gz"
          $url2 = "https://sourceforge.net/projects/boost/files/boost/$ver/$folder.tar.gz"
          
          try {
            Invoke-WebRequest -Uri $url -OutFile "${{ runner.temp }}/boost.tar.gz"
            tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          } catch {
            Invoke-WebRequest -Uri $url2 -OutFile "${{ runner.temp }}/boost.tar.gz"
            tar -xf "${{ runner.temp }}/boost.tar.gz" -C "${{ github.workspace }}/.."
          }
          Move-Item "${{ github.workspace }}/../$folder" "${{ env.boost_path }}"
          
          & "${{ env.vcpkg_path }}/installed/${{ matrix.config.arch }}-windows-static-md-release/tools/boost-build/b2.exe" `
            -d0 `
            toolset=msvc `
            --prefix="${{ env.boost_path }}" `
            --with-headers `
            install

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          arch: ${{ matrix.config.qt_arch }}
          archives: qtbase qtsvg qttools
          modules: qtimageformats
          cache: true

      - name: Build libtorrent
        run: |
          git clone `
            --branch v${{ matrix.libtorrent.version }} `
            --depth 1 `
            --recurse-submodules `
            https://github.com/arvidn/libtorrent.git `
            ${{ env.libtorrent_path }}
          
          $env:CXXFLAGS += " /guard:cf"
          $env:LDFLAGS  += " /GUARD:CF"
          cmake `
            -S ${{ env.libtorrent_path }} `
            -B ${{ env.libtorrent_path }}/build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=20 `
            -DCMAKE_INSTALL_PREFIX="${{ env.libtorrent_path }}/install" `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DBOOST_ROOT="${{ env.boost_path }}" `
            -DBUILD_SHARED_LIBS=OFF `
            -Ddeprecated-functions=OFF `
            -Dstatic_runtime=OFF `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.config.arch }}-windows-static-md-release
          cmake --build ${{ env.libtorrent_path }}/build --config Release
          cmake --install ${{ env.libtorrent_path }}/build --config Release

      - name: Build qBittorrent
        run: |
          $env:CXXFLAGS += " /DQT_FORCE_ASSERTS /WX"
          cmake `
            -S . `
            -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.vcpkg_path }}/scripts/buildsystems/vcpkg.cmake" `
            -DBOOST_ROOT="${{ env.boost_path }}" `
            -DLibtorrentRasterbar_DIR="${{ env.libtorrent_path }}/install/lib/cmake/LibtorrentRasterbar" `
            -DMSVC_RUNTIME_DYNAMIC=ON `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.config.arch }}-windows-static-md-release `
            -DVERBOSE_CONFIGURE=ON
          cmake --build build --config Release --target qbt_update_translations
          cmake --build build --config Release

      - name: Prepare portable package
        run: |
          $portableDir = "upload/qBittorrent_portable"
          New-Item -ItemType Directory -Force -Path $portableDir
          Copy-Item build/qbittorrent.exe $portableDir
          Copy-Item dist/windows/qt.conf $portableDir
          
          # Qt runtime libraries
          $qtBin = "${{ env.QT_ROOT_DIR }}/bin"
          @("Qt6Core.dll","Qt6Gui.dll","Qt6Network.dll","Qt6Sql.dll",
            "Qt6Svg.dll","Qt6Widgets.dll","Qt6Xml.dll") | % {
              Copy-Item "$qtBin/$_" $portableDir
          }
          
          # Plugins
          $plugins = @{
            "plugins/iconengines"   = @("qsvgicon.dll")
            "plugins/imageformats"  = @("qgif.dll","qicns.dll","qico.dll","qjpeg.dll",
                                        "qsvg.dll","qtga.dll","qtiff.dll","qwbmp.dll","qwebp.dll")
            "plugins/platforms"     = @("qwindows.dll")
            "plugins/sqldrivers"    = @("qsqlite.dll")
            "plugins/styles"        = @("qmodernwindowsstyle.dll")
            "plugins/tls"           = @("qschannelbackend.dll")
          }
          foreach ($dir in $plugins.Keys) {
            $targetDir = "$portableDir/$dir"
            New-Item -ItemType Directory -Force -Path $targetDir
            foreach ($dll in $plugins[$dir]) {
              Copy-Item "$qtBin/../$dir/$dll" $targetDir
            }
          }
          
          # Создаём zip-архив
          $zipName = "qBittorrent_Windows_${{ matrix.config.arch }}_libtorrent-${{ matrix.libtorrent.version }}_portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $zipName
          echo "zipName=$zipName" >> $env:GITHUB_ENV

      - name: Install NSIS and create installer
        run: |
          # Установка NSIS вручную через chocolatey
          choco install nsis --version=3.11 --no-progress -y
          $env:Path += ";C:\Program Files (x86)\NSIS"
          
          # Распаковка плагинов NSIS
          Expand-Archive -Force -Path "dist/windows/NSISPlugins.zip" -DestinationPath "dist/windows/"
          
          $installerName = "qBittorrent_Windows_${{ matrix.config.arch }}_libtorrent-${{ matrix.libtorrent.version }}_setup.exe"
          & makensis `
            /DQBT_CPU_ARCH="${{ matrix.config.arch }}" `
            /DQBT_DIST_DIR="../../upload/qBittorrent_portable" `
            /WX `
            dist/windows/qbittorrent.nsi
          
          Move-Item "dist/windows/qbittorrent_*_setup.exe" $installerName
          echo "installerName=$installerName" >> $env:GITHUB_ENV

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.zipName }}
            ${{ env.installerName }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
